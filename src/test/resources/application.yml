## 테스트 전용 설정 — 실제 PostgreSQL 컨테이너(Testcontainers)를 사용한다. (ADR-011)
## datasource 설정은 두지 않는다. TestcontainersConfig의 @ServiceConnection이 주입한다.
## H2를 다시 도입하지 말 것: 마이그레이션이 검증되지 않고 H2 통과가 PostgreSQL 통과를 보장하지 않는다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다. 엔티티와 마이그레이션이 어긋나면 테스트가 실패해야 한다.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        ## 운영 설정과 같은 값을 여기에도 둔다. 테스트 클래스패스의 application.yml은 운영 것과
        ## 병합되지 않고 **통째로 가린다** — 여기 없으면 Boot 기본 상한 2,000이 적용되어
        ## "?size=5000이 잘린다"는 테스트가 아무것도 검증하지 못한다.
        default-page-size: 20
        max-page-size: 50

ainewsdigest:
  telegram:
    polling:
      ## 테스트에서 폴러가 뜨면 백그라운드 스레드가 실제 텔레그램 API를 때린다.
      ## @SpringBootTest 컨텍스트마다 하나씩 붙어 테스트를 불안정하게 만든다. 반드시 끈다.
      enabled: false
  scheduler:
    ## 같은 이유로 배치도 끈다. 테스트 도중 07:00이 지나면 실제 OpenAI·텔레그램 호출이 나간다.
    ## DigestScheduler의 @ConditionalOnProperty가 이 값을 읽는다.
    enabled: false
