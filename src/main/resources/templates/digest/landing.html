<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AI News Digest')}"></head>
<body>
<div class="page">
	<div th:replace="~{fragments/layout :: header}"></div>

	<main>
		<section class="intro">
			<h1 class="page-title">개발자를 위한 AI 뉴스 다이제스트</h1>
			<p class="intro__lead">매일 오전 7시 30분, 알아두면 좋은 AI 소식 3~5건을 한글 요약으로 텔레그램에 보내드립니다.</p>
			<a class="btn-primary" th:href="${subscribeUrl}" target="_blank" rel="noopener noreferrer">텔레그램으로 구독하기</a>
		</section>

		<!--/* 설명보다 실물을 먼저 보여준다 (PRD 디자인 / ADR-004). */-->
		<section class="recent">
			<p class="notice" th:if="${#lists.isEmpty(digests)}">아직 발송된 다이제스트가 없습니다.</p>

			<article class="card digest" th:each="digest : ${digests}">
				<h2 class="date-header" th:text="${digest.displayDate}">2026년 8월 5일 (수)</h2>
				<p class="notice" th:if="${digest.empty}">오늘의 AI 뉴스는 없습니다.</p>
				<!--/* th:replace는 th:unless보다 먼저 실행된다. 같은 태그에 걸면 조건이 무시되므로 감싼다. */-->
				<th:block th:unless="${digest.empty}">
					<div th:replace="~{fragments/layout :: items(${digest.items})}"></div>
				</th:block>
			</article>

			<p class="more" th:unless="${#lists.isEmpty(digests)}">
				<a th:href="@{/archive}">지난 다이제스트 모두 보기</a>
			</p>
		</section>
	</main>

	<div th:replace="~{fragments/layout :: footer}"></div>
</div>
</body>
</html>
