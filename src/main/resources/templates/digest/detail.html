<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${digest.displayDate} + ' | AI News Digest')}"></head>
<body>
<div class="page">
	<div th:replace="~{fragments/layout :: header}"></div>

	<main>
		<p class="back"><a class="btn-text" th:href="@{/archive}">← 아카이브</a></p>
		<h1 class="page-title" th:text="${digest.displayDate}">2026년 8월 5일 (수)</h1>

		<p class="notice" th:if="${digest.empty}">오늘의 AI 뉴스는 없습니다.</p>
		<!--/* th:replace는 th:unless보다 먼저 실행된다. 같은 태그에 걸면 조건이 무시되므로 감싼다. */-->
		<th:block th:unless="${digest.empty}">
			<div th:replace="~{fragments/layout :: items(${digest.items})}"></div>
		</th:block>
	</main>

	<div th:replace="~{fragments/layout :: footer}"></div>
</div>
</body>
</html>
