name: CI

# 이미지 빌드·배포 job은 두지 않는다. 자동 배포는 PRD의 MVP 제외 사항이고,
# 러너는 x86_64인데 운영 서버는 ARM64라 크로스 빌드(buildx)와 레지스트리가 따로 필요하다.
on:
  push:
  pull_request:

jobs:
  build:
    name: build & test
    # ubuntu-latest에는 Docker 데몬이 있어 Testcontainers PostgreSQL이 그대로 뜬다 (ADR-011).
    # H2로 갈아타지 말 것 — 마이그레이션이 검증되지 않는다.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # 의존성과 빌드 캐시를 저장·복원한다.
        uses: gradle/actions/setup-gradle@v4

      # gradlew는 저장소에 100644(비실행)로 들어 있다. checkout이 모드를 그대로
      # 복원하므로 이 줄이 없으면 다음 스텝이 permission denied로 죽는다.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        # 빌드가 깨졌을 때 원인을 보려는 것이므로 실패해도 올린다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          if-no-files-found: warn
